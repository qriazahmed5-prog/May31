name: Build Universal Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false -Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true

    - name: Generate complete Android platform
      run: flutter create . --platforms=android --org com.example --project-name may31

    - name: Remove duplicate MainActivity
      run: rm -rf android/app/src/main/java

    - name: Fix Kotlin, memory, and Firebase
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import re

        settings = Path("android/settings.gradle")
        s = settings.read_text()
        s = re.sub(
            r'id "org\.jetbrains\.kotlin\.android" version "[^"]+"',
            'id "org.jetbrains.kotlin.android" version "1.9.22"',
            s,
        )
        if "com.google.gms.google-services" not in s:
            s2, n = re.subn(
                r'(id "org\.jetbrains\.kotlin\.android"[^\n]+)',
                r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                s,
                count=1,
            )
            if n == 0:
                raise SystemExit("Could not patch android/settings.gradle")
            s = s2
        settings.write_text(s)

        app_path = Path("android/app/build.gradle")
        a = app_path.read_text()
        if "com.google.gms.google-services" not in a:
            a = a.replace(
                'id "dev.flutter.flutter-gradle-plugin"',
                'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"',
            )
        a = a.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 21")
        if "minifyEnabled" not in a:
            a = a.replace(
                "signingConfig signingConfigs.debug",
                "signingConfig signingConfigs.debug\n            minifyEnabled false\n            shrinkResources false",
            )
        app_path.write_text(a)

        Path("android/gradle.properties").write_text(
            "org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError\n"
            "android.useAndroidX=true\n"
            "android.enableJetifier=true\n"
            "kotlin.incremental=false\n"
        )
        print("Patched Kotlin 1.9.22, memory, and Firebase")
        PY

    - name: Install Dependencies
      run: flutter pub get

    - name: Build Release APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: may31-universal-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
